<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Nota</title>
    <style>
        body { font-family: Verdana, sans-serif; color: #333; margin: 20px; }
        .invoice-box { max-width: 800px; margin: auto; padding: 30px; border: 1px solid #eee;
                       box-shadow: 0 0 10px rgba(0, 0, 0, 0.15); font-size: 14px; line-height: 22px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .title { font-size: 42px; color: #64344e; font-weight: bold; }
        .details { text-align: right; }
        .company-details { margin-bottom: 20px; padding: 15px;
                           background: #ffffff; border-left: 4px solid #c66f9d; }
        .invoice-table { width: 100%; border-collapse: collapse; }
        .invoice-table th { background: #64344e; color: white; padding: 10px; text-align: left; }
        .invoice-table td { padding: 10px; border-bottom: 1px solid #eee; }
        .invoice-table tfoot td { padding: 8px 10px; }
        .total-row td { border-top: 2px solid #64344e; font-weight: bold;
                        font-size: 16px; color: #64344e; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        h1 { font-size: medium; }
        h2 { font-size: small; }
    </style>
</head>
<body>
    <div class="invoice-box">
        <div class="header">
            <div class="title">
                <h1>NOTA</h1>
                <h2>PT. CHIIKAWA</h2>
                <h2>Jl. Chiikawa Park No. 111</h2>
                <h2>+111 222 333</h2>
            </div>
            
            <div class="details">
                <strong>No Nota:</strong> {{invoiceNumber}}<br>
                <strong>Tanggal:</strong> {{date}}
            </div>
        </div>

        <div class="company-details">
            <strong>Kepada:</strong><br>
            {{customerName}}<br>
            {{customerAddress}}
        </div>

        <table class="invoice-table">
            <thead>
                <tr>
                    <th>Cetakan</th>
                    <th class="text-right">Harga</th>
                    <th class="text-center">Jumlah</th>
                    <th class="text-right">Subtotal</th>
                </tr>
            </thead>
            <tbody>
                {{itemRows}}
            </tbody>
            <tfoot>
                <tr><td colspan="3" class="text-right">DPP</td><td class="text-right">Rp{{dpp}}</td></tr>
                <tr><td colspan="3" class="text-right">PPN 11%</td><td class="text-right">Rp{{ppn}}</td></tr>
                <tr class="total-row"><td colspan="3" class="text-right">TOTAL</td><td class="text-right">Rp{{totalAmount}}</td></tr>
            </tfoot>
        </table>
    </div>
</body>
</html>
